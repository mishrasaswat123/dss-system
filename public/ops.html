<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06080f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ADVISIQ OPS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
:root{
  --bg:#06080f;--s1:#0a0e1a;--s2:#0f1424;--s3:#141928;
  --b1:#1a2235;--b2:#223050;--b3:#2d3f65;
  --tx:#dde4f0;--t2:#8898b8;--t3:#4a5878;
  --ac:#4080ff;--ac2:#2860e0;--acb:#0a1835;
  --gn:#18c97a;--gnb:#081f12;--gn2:#0fa860;
  --am:#f0a020;--amb:#1a1000;--am2:#c88010;
  --rd:#e03040;--rdb:#1a0508;
  --pu:#8050e0;--pub:#110828;
  --mono:'SF Mono','Fira Code','JetBrains Mono',monospace;
  --ui:'SF Pro Display',-apple-system,'Helvetica Neue',sans-serif;
  --r:10px;--r2:14px;--r3:20px;
  --sh:0 4px 24px rgba(0,0,0,.4);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ── CLIPBOARD HELPER ── */
#_cp{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}

/* ── AUTH ── */
#auth{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;z-index:999}
.auth-mark{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--t3);margin-bottom:48px}
.auth-mark b{color:var(--ac)}
.auth-h{font-size:22px;font-weight:700;letter-spacing:-.3px;margin-bottom:6px}
.auth-s{font-family:var(--mono);font-size:11px;color:var(--t3);margin-bottom:36px}
.auth-in{width:100%;max-width:300px;background:var(--s2);border:1.5px solid var(--b2);border-radius:var(--r2);padding:15px 18px;font-family:var(--mono);font-size:14px;color:var(--tx);outline:none;letter-spacing:.08em;margin-bottom:10px}
.auth-in:focus{border-color:var(--ac)}
.auth-btn{width:100%;max-width:300px;height:52px;background:var(--ac);border:none;border-radius:var(--r2);font-family:var(--ui);font-size:15px;font-weight:700;color:#fff;cursor:pointer;letter-spacing:.01em}
.auth-btn:active{background:var(--ac2)}
.auth-err{font-family:var(--mono);font-size:11px;color:var(--rd);margin-top:10px;min-height:18px}

/* ── LAYOUT ── */
#app{display:none;height:100%;flex-direction:column}
#app.on{display:flex}
.bar{flex-shrink:0;height:52px;background:var(--s1);border-bottom:1px solid var(--b1);display:flex;align-items:center;padding:0 14px;gap:8px}
.bar-logo{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--t3);flex:1}
.bar-logo b{color:var(--ac)}
.bar-time{font-family:var(--mono);font-size:11px;color:var(--t3)}
.bar-btn{height:34px;padding:0 12px;background:var(--s2);border:1px solid var(--b2);border-radius:8px;font-family:var(--mono);font-size:10px;color:var(--t2);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;letter-spacing:.04em}
.bar-btn:active{background:var(--b1)}
.bar-btn.primary{background:var(--acb);border-color:var(--ac2);color:var(--ac);font-weight:600}
.bar-btn.primary:active{background:var(--b1)}

/* ── TABS ── */
.tabs{flex-shrink:0;background:var(--s1);border-bottom:1px solid var(--b1);display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:56px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);border-bottom:2px solid transparent;cursor:pointer;transition:color .12s,border-color .12s;position:relative;padding:0 4px}
.tab.on{color:var(--ac);border-bottom-color:var(--ac)}
.tab-ico{font-size:14px;line-height:1}
.badge{position:absolute;top:6px;right:6px;background:var(--rd);color:#fff;font-size:8px;font-weight:700;border-radius:6px;padding:1px 4px;min-width:14px;text-align:center;display:none}
.badge.on{display:block}

/* ── SCROLL BODY ── */
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:72px}

/* ── SECTION ── */
.sec{padding:12px 12px 4px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);display:flex;align-items:center;justify-content:space-between}
.sec-ct{background:var(--s2);border:1px solid var(--b1);border-radius:4px;padding:2px 6px;font-size:9px;color:var(--t2)}

/* ── BRIEF CARD ── */
.brief{margin:10px 10px 0;background:var(--acb);border:1px solid var(--b2);border-radius:var(--r2);padding:14px}
.brief-day{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);margin-bottom:10px}
.brief-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.bstat{background:rgba(0,0,0,.25);border-radius:8px;padding:10px 8px;text-align:center}
.bstat-n{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1;color:var(--tx)}
.bstat-n.red{color:var(--rd)}.bstat-n.grn{color:var(--gn)}.bstat-n.amb{color:var(--am)}
.bstat-l{font-family:var(--mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-top:3px}
.brief-lines{border-top:1px solid rgba(255,255,255,.06);padding-top:8px;display:flex;flex-direction:column;gap:3px}
.brief-line{font-family:var(--mono);font-size:10px;color:var(--t2)}

/* ── CARDS ── */
.card{margin:6px 10px 0;background:var(--s2);border:1px solid var(--b2);border-radius:var(--r2);overflow:hidden}
.card.urgent{background:var(--rdb);border-color:#5a1020}
.card.cohort{background:var(--gnb);border-color:#0a4020}
.card.intel{background:var(--pub);border-color:#2a1060}
.card-top{padding:12px 14px 8px;display:flex;align-items:flex-start;gap:10px}
.card-av{width:34px;height:34px;border-radius:9px;background:var(--acb);border:1px solid var(--b2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ac);flex-shrink:0}
.card-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.card-ic-urgent{background:rgba(200,40,60,.2)}.card-ic-action{background:var(--acb)}.card-ic-cohort{background:rgba(10,100,50,.2)}
.card-info{flex:1;min-width:0}
.card-name{font-size:14px;font-weight:600;color:var(--tx);line-height:1.3;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-sub{font-family:var(--mono);font-size:10px;color:var(--t3);letter-spacing:.03em}
.card-stage{font-family:var(--mono);font-size:9px;padding:3px 7px;border-radius:4px;flex-shrink:0;white-space:nowrap;align-self:flex-start}
.cs-src{background:var(--s3);color:var(--t2);border:1px solid var(--b1)}
.cs-sent{background:var(--acb);color:var(--ac);border:1px solid var(--ac2)}
.cs-demo{background:var(--amb);color:var(--am);border:1px solid #604008}
.cs-beta{background:var(--gnb);color:var(--gn);border:1px solid #085030}
.cs-done{background:var(--s3);color:var(--t3);border:1px solid var(--b1)}
.card-note{padding:0 14px 8px;font-size:12px;color:var(--t3);line-height:1.4;font-style:italic}
.card-warn{margin:0 14px 8px;background:rgba(240,160,32,.08);border:1px solid rgba(240,160,32,.25);border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:10px;color:var(--am)}

/* ── ACTION STRIP ── */
.actions{padding:0 14px 12px;display:flex;gap:6px;flex-wrap:wrap}
/* All action buttons min 44px height for thumb certainty */
.btn{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.04em;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;-webkit-user-select:none;user-select:none}
.btn:active{opacity:.75;transform:scale(.97)}
.btn-copy{background:var(--acb);color:var(--ac);border-color:var(--ac2)}
.btn-open{background:var(--amb);color:var(--am);border-color:#604008}
.btn-both{background:var(--acb);color:var(--ac);border-color:var(--ac);font-weight:700}
.btn-done{background:var(--gnb);color:var(--gn);border-color:#085030;font-weight:600}
.btn-adv{background:var(--gnb);color:var(--gn);border-color:#085030}
.btn-snooze{background:var(--s3);color:var(--t2);border-color:var(--b1)}
.btn-close{background:var(--rdb);color:var(--rd);border-color:#5a1020}
.btn-note{background:var(--pub);color:var(--pu);border-color:#3a1880}
.btn-full{flex:1}

/* ── SWIPE ── */
.swipeable{transition:transform .18s ease,opacity .18s ease}
.sw-out-r{transform:translateX(110%);opacity:0}
.sw-out-l{transform:translateX(-110%);opacity:0}
.swipe-hint{padding:2px 14px 0;font-family:var(--mono);font-size:9px;color:var(--t3);display:flex;justify-content:space-between;letter-spacing:.05em;opacity:.6}

/* ── TEMPLATE ENGINE ── */
.tpl-grp{margin:6px 10px 0;background:var(--s2);border:1px solid var(--b2);border-radius:var(--r2);overflow:hidden}
.tpl-grp-h{background:var(--acb);padding:9px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b1);cursor:pointer}
.tpl-grp-title{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--ac);letter-spacing:.1em;text-transform:uppercase}
.tpl-grp-meta{font-family:var(--mono);font-size:10px;color:var(--t3);display:flex;gap:8px;align-items:center}
.tpl-grp-arrow{font-size:12px;transition:transform .2s}
.tpl-grp-arrow.open{transform:rotate(180deg)}
.tpl-items{display:none}
.tpl-items.open{display:block}
.tpl-row{padding:10px 14px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:10px}
.tpl-row:last-child{border-bottom:none}
.tpl-info{flex:1;min-width:0}
.tpl-label{font-family:var(--mono);font-size:10px;color:var(--ac);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px;display:flex;align-items:center;gap:5px}
.tpl-tag{font-family:var(--mono);font-size:9px;background:var(--amb);color:var(--am);border:1px solid rgba(240,160,32,.3);padding:1px 5px;border-radius:3px}
.tpl-preview{font-size:12px;color:var(--t2);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ── SOURCE ── */
.src-card{margin:6px 10px 0;background:var(--s2);border:1px solid var(--b2);border-radius:var(--r2);overflow:hidden}
.src-head{background:rgba(24,201,122,.06);border-bottom:1px solid var(--b2);padding:9px 14px;display:flex;align-items:center;gap:8px}
.src-head-title{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--gn);letter-spacing:.1em;text-transform:uppercase}
.src-item{padding:12px 14px;border-bottom:1px solid var(--b1)}
.src-item:last-child{border-bottom:none}
.src-label{font-family:var(--mono);font-size:10px;color:var(--gn);letter-spacing:.06em;margin-bottom:4px}
.src-query{font-family:var(--mono);font-size:12px;color:var(--tx);line-height:1.5;margin-bottom:6px}
.src-note{font-size:12px;color:var(--t3);line-height:1.4;margin-bottom:8px}
.src-btns{display:flex;gap:6px}

/* ── TRAFFIC ── */
.t-card{margin:6px 10px 0;background:var(--s2);border:1px solid var(--b2);border-radius:var(--r2);padding:14px}
.t-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}
.t-stat{background:var(--s3);border-radius:8px;padding:11px 14px}
.t-stat-n{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--tx);line-height:1}
.t-stat-l{font-family:var(--mono);font-size:9px;color:var(--t3);margin-top:3px;letter-spacing:.08em;text-transform:uppercase}
.t-bars{display:flex;flex-direction:column;gap:7px}
.t-bar{display:flex;align-items:center;gap:10px}
.t-bar-l{font-family:var(--mono);font-size:10px;color:var(--t3);width:64px;flex-shrink:0}
.t-bar-track{flex:1;height:5px;background:var(--b1);border-radius:3px;overflow:hidden}
.t-bar-fill{height:100%;border-radius:3px;transition:width .5s ease}
.tf-li{background:var(--ac)}.tf-wa{background:var(--gn)}.tf-di{background:var(--t3)}.tf-ot{background:var(--am)}
.t-bar-n{font-family:var(--mono);font-size:10px;color:var(--t2);width:18px;text-align:right;flex-shrink:0}

/* ── ADD FORM ── */
.form{margin:6px 10px 0;background:var(--s2);border:1px solid var(--b2);border-radius:var(--r2);padding:14px}
.form-title{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:14px}
.ff{margin-bottom:12px}
.ff-label{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:5px;display:block}
.ff-in,.ff-sel{width:100%;background:var(--s3);border:1.5px solid var(--b2);border-radius:8px;padding:11px 13px;color:var(--tx);font-family:var(--mono);font-size:13px;outline:none;min-height:44px}
.ff-in:focus,.ff-sel:focus{border-color:var(--ac)}
.ff-sel{appearance:none;cursor:pointer}
.ff-wrap{position:relative}.ff-wrap::after{content:'▾';position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none}
.form-btn{width:100%;min-height:50px;background:var(--ac);border:none;border-radius:10px;font-family:var(--ui);font-size:15px;font-weight:700;color:#fff;cursor:pointer;margin-top:4px;letter-spacing:.01em}
.form-btn:active{background:var(--ac2)}

/* ── DAILY MODE ── */
#daily{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;flex-direction:column}
#daily.on{display:flex}
.dm-bar{height:52px;background:var(--s1);border-bottom:1px solid var(--b1);display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0}
.dm-title{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);flex:1;font-weight:600}
.dm-exit{height:34px;padding:0 14px;background:var(--s2);border:1px solid var(--b2);border-radius:8px;font-family:var(--mono);font-size:10px;color:var(--t2);cursor:pointer}
.dm-exit:active{background:var(--b1)}
.dm-prog-wrap{height:3px;background:var(--b1);flex-shrink:0}
.dm-prog{height:100%;background:var(--ac);transition:width .3s ease;will-change:width}
.dm-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px 16px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.dm-meta{font-family:var(--mono);font-size:10px;color:var(--t3);margin-bottom:6px;letter-spacing:.06em}
.dm-step{font-family:var(--mono);font-size:12px;color:var(--t2);margin-bottom:20px}
.dm-card{background:var(--s2);border:1px solid var(--b2);border-radius:var(--r2);width:100%;max-width:440px;overflow:hidden;box-shadow:var(--sh);margin-bottom:16px}
.dm-card-top{padding:16px 16px 10px}
.dm-card-name{font-size:17px;font-weight:700;color:var(--tx);margin-bottom:3px}
.dm-card-meta{font-family:var(--mono);font-size:11px;color:var(--t3)}
.dm-card-note{padding:0 16px 10px;font-size:13px;color:var(--t3);font-style:italic;line-height:1.4}
.dm-card-warn{margin:0 16px 10px;background:rgba(240,160,32,.08);border:1px solid rgba(240,160,32,.25);border-radius:6px;padding:8px 12px;font-family:var(--mono);font-size:10px;color:var(--am)}
.dm-actions{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
.dm-btn{width:100%;min-height:52px;border-radius:10px;border:none;font-family:var(--ui);font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.01em}
.dm-btn:active{opacity:.8;transform:scale(.98)}
.dm-btn-copy{background:var(--ac);color:#fff}
.dm-btn-open{background:var(--amb);color:var(--am);border:1.5px solid #604008;font-size:14px}
.dm-btn-both{background:var(--ac);color:#fff}
.dm-btn-adv{background:var(--gn);color:#041a0c}
.dm-btn-skip{background:var(--s3);color:var(--t2);border:1px solid var(--b2);font-size:13px}
.dm-row{display:flex;gap:8px}
.dm-row .dm-btn{flex:1}
.dm-done{padding:48px 24px;text-align:center;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dm-done-ico{font-size:48px;margin-bottom:16px}
.dm-done-h{font-size:20px;font-weight:700;color:var(--gn);margin-bottom:8px}
.dm-done-s{font-family:var(--mono);font-size:12px;color:var(--t3);line-height:1.7}
.dm-low-btn{width:100%;max-width:440px;min-height:44px;background:rgba(240,160,32,.07);border:1px solid rgba(240,160,32,.2);border-radius:10px;font-family:var(--mono);font-size:11px;color:var(--am);cursor:pointer;margin-bottom:16px;letter-spacing:.04em}
.dm-low-btn:active{background:rgba(240,160,32,.15)}

/* ── NOTES SHEET ── */
#notes-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;align-items:flex-end}
#notes-overlay.on{display:flex}
.notes-sheet{background:var(--s1);border-radius:20px 20px 0 0;padding:20px 16px 36px;width:100%;border-top:1px solid var(--b2)}
.notes-h{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);margin-bottom:12px}
.notes-ta{width:100%;background:var(--s2);border:1.5px solid var(--b2);border-radius:10px;padding:12px 14px;color:var(--tx);font-family:var(--mono);font-size:13px;outline:none;resize:none;height:90px;min-height:44px}
.notes-ta:focus{border-color:var(--ac)}
.notes-btns{display:flex;gap:8px;margin-top:10px}
.notes-save{flex:1;min-height:48px;background:var(--ac);border:none;border-radius:10px;font-family:var(--ui);font-size:14px;font-weight:700;color:#fff;cursor:pointer}
.notes-cancel{min-height:48px;padding:0 18px;background:var(--s2);border:1px solid var(--b2);border-radius:10px;font-family:var(--mono);font-size:12px;color:var(--t2);cursor:pointer}

/* ── COPY TRAY ── */
#tray{position:fixed;bottom:72px;left:10px;right:10px;background:var(--s1);border:1px solid var(--b2);border-radius:var(--r2);padding:12px 14px;z-index:100;display:none;box-shadow:var(--sh)}
#tray.on{display:block}
.tray-h{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:8px;display:flex;justify-content:space-between}
.tray-x{color:var(--t3);cursor:pointer;font-size:16px;line-height:1}
.tray-item{background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:9px 12px;margin-bottom:5px;display:flex;align-items:center;gap:8px;cursor:pointer;min-height:44px}
.tray-item:last-child{margin-bottom:0}
.tray-item:active{background:var(--acb)}
.tray-label{font-family:var(--mono);font-size:11px;color:var(--ac);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tray-recopy{font-family:var(--mono);font-size:10px;color:var(--t3)}

/* ── STICKY NEXT ── */
#sticky{position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,26,.96);border-top:1px solid var(--b2);padding:10px 14px;display:none;align-items:center;gap:10px;z-index:50;backdrop-filter:blur(16px)}
#sticky.on{display:flex}
.sticky-txt{flex:1;font-family:var(--mono);font-size:11px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sticky-act{min-height:40px;padding:0 16px;background:var(--ac);border:none;border-radius:8px;font-family:var(--ui);font-size:13px;font-weight:700;color:#fff;cursor:pointer;white-space:nowrap}
.sticky-act:active{background:var(--ac2)}

.empty{padding:52px 28px;text-align:center}
.empty-ico{font-size:36px;margin-bottom:14px;opacity:.35}
.empty-h{font-size:16px;font-weight:600;color:var(--t2);margin-bottom:6px}

.empty-action{display:inline-block;margin-top:16px;min-height:44px;padding:0 20px;background:var(--acb);border:1px solid var(--ac2);border-radius:8px;font-family:var(--mono);font-size:11px;color:var(--ac);cursor:pointer;line-height:44px}
.swipe-hint{padding:3px 14px 0;font-family:var(--mono);font-size:9px;color:var(--t3);display:flex;justify-content:space-between;letter-spacing:.05em;opacity:.55}

<script>

const API='';

// ── CLIPBOARD: single reliable method for Android Chrome ──
// Uses a visible-but-offscreen textarea + execCommand.
// Must be called synchronously from a user gesture.
function doCopy(text){
  var el=document.getElementById('_cp');
  el.value=text;
  el.focus();
  el.select();
  try{document.execCommand('copy');}catch(e){}
}

function doOpen(url){
  if(!url||!url.startsWith('http'))return;
  const a=document.createElement('a');
  a.href=url;a.target='_blank';a.rel='noopener noreferrer';
  a.style.display='none';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>document.body.removeChild(a),100);
}

// cp: OPEN first (sync), COPY second (sync) — both in same gesture
function cp(text,label,url){
  const hasPH=/\[[A-Z][A-Z _]+\]/.test(text);
  if(hasPH){
    const ok=window.confirm('Placeholders remain: '+text.match(/\[[A-Z][A-Z _]+\]/g).join(', ')+'\n\nCopy anyway?');
    if(!ok)return;
  }
  doCopy(text);
  if(url)doOpen(url);
  pushTray(text,label);
  toast('📋 '+label);
}

function cpOnly(text,label){
  const hasPH=/\[[A-Z][A-Z _]+\]/.test(text);
  if(hasPH){
    const ok=window.confirm('Placeholders: '+text.match(/\[[A-Z][A-Z _]+\]/g).join(', ')+'\n\nCopy anyway?');
    if(!ok)return;
  }
  doCopy(text);
  pushTray(text,label);
  toast('📋 '+label);
}

function openOnly(url){doOpen(url);toast('Opening LinkedIn ↗');}

// ── TOAST ──
let toastTimer;
function toast(m,ms=1800){
  const t=document.getElementById('toast');
  t.textContent=m;t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('on'),ms);
}

// ── TRAY ──
function pushTray(text,label){
  recentCopies=recentCopies.filter(r=>r.label!==label);
  recentCopies.unshift({text,label});
  if(recentCopies.length>3)recentCopies.pop();
  renderTray();
}
function toggleTray(){
  const t=document.getElementById('tray');
  t.classList.toggle('on');
  if(t.classList.contains('on'))renderTray();
}
function hideTray(){document.getElementById('tray').classList.remove('on');}
function renderTray(){
  const el=document.getElementById('tray-items');
  if(!recentCopies.length){el.innerHTML='<div style="font-family:var(--mono);font-size:11px;color:var(--t3);padding:6px 0">No recent copies</div>';return;}
  el.innerHTML=recentCopies.map((r,i)=>`<div class="tray-item" onclick="reCopy(${i})"><div class="tray-label">${r.label}</div><div class="tray-recopy">Re-copy</div></div>`).join('');
}
function reCopy(i){
  const r=recentCopies[i];if(!r)return;
  doCopy(r.text);
  toast('📋 Re-copied — '+r.label);
  hideTray();
}

// ── CLOCK ──
function tick(){const n=new Date();document.getElementById('clock').textContent=n.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});}

// ── FETCH ──
function fx(url,opts={}){
  return fetch(API+url,{...opts,headers:{'x-ops-auth':AUTH,'Content-Type':'application/json',...(opts.headers||{})}}).then(r=>r.json());
}

// ── AUTH ──
function doAuth(){
  const pw=document.getElementById('auth-pw').value.trim();
  if(!pw)return;
  AUTH=pw;
  fx('/api/v1/ops/brief').then(d=>{
    if(d.status==='OK'){
      document.getElementById('auth').style.display='none';
      document.getElementById('app').classList.add('on');
      tick();setInterval(tick,30000);
      const lt=getSaved('ops_tab')||'feed';
      loadAll();go(lt);
    }else{AUTH='';document.getElementById('auth-err').textContent='Invalid password';}
  }).catch(()=>{AUTH='';document.getElementById('auth-err').textContent='Connection failed';});
}
document.getElementById('auth-pw').addEventListener('keydown',e=>{if(e.key==='Enter')doAuth();});

// ── SESSION STORAGE ──
function save(k,v){try{sessionStorage.setItem(k,v);}catch(e){}}
function getSaved(k){try{return sessionStorage.getItem(k);}catch(e){return null;}}

// ── NAV ──
function go(tab){
  CUR=tab;save('ops_tab',tab);
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab));
  document.querySelectorAll('.body').forEach(p=>p.style.display='none');
  document.getElementById('pane-'+tab).style.display='block';
  document.getElementById('sticky').classList.remove('on');
  hideTray();
  if(tab==='feed')loadFeed();
  else if(tab==='queue')loadQueue();
  else if(tab==='msgs')renderMsgs();
  else if(tab==='source')renderSource();
  else if(tab==='pipeline')loadPipeline();
  else if(tab==='traffic')loadTraffic();
  else if(tab==='add')renderAdd();
}

function loadAll(){loadFeed();loadQueue();loadPipeline();loadTraffic();}

function getCRMsg(r){
  r=(r||'').toLowerCase();
  if(r.indexOf('ifa')>=0)return T['Connection Request'][0].t;
  if(r.indexOf('ria')>=0)return T['Connection Request'][1].t;
  if(r.indexOf('wealth')>=0)return T['Connection Request'][2].t;
  if(r.indexOf('pms')>=0)return T['Connection Request'][3].t;
  if(r.indexOf('family')>=0)return T['Connection Request'][4].t;
  return T['Connection Request'][5].t;
}
const STAGE_LABEL={SOURCED:'Sourced',CONNECTION_SENT:'Request Sent',ACCEPTED:'Connected',MSG1_SENT:'Conversation Active',MSG2_SENT:'Followed Up',MSG3_SENT:'Final Sent',DEMO_REQUESTED:'Demo Requested',DEMO_SCHEDULED:'Demo Scheduled',DEMO_DONE:'Demo Done',BETA_INVITED:'Beta Cohort',CLOSED:'Closed'};
const STAGE_ORDER=['SOURCED','CONNECTION_SENT','ACCEPTED','MSG1_SENT','MSG2_SENT','MSG3_SENT','DEMO_REQUESTED','DEMO_SCHEDULED','DEMO_DONE','BETA_INVITED'];
const AE={
  CONNECTION_READY:{d:'Send Connection Request',cp:true,msg:function(r){return getCRMsg(r);},nx:'CONNECTION_SENT',lbl:'Request Sent'},
  ACCEPTED_CHECK:{d:'Check Acceptance',cp:false,msg:null,nx:'ACCEPTED',lbl:'Mark Connected'},
  MSG1_SEND:{d:'Send First DM',cp:true,msg:function(){return T['First DM'][0].t;},nx:'MSG1_SENT',lbl:'DM Sent'},
  MSG2_FOLLOW:{d:'Send Day-7 Follow-up',cp:true,msg:function(){return T['Day 7 Follow-Up'][0].t;},nx:'MSG2_SENT',lbl:'Followed Up'},
  MSG3_FINAL:{d:'Send Final Nudge',cp:true,msg:function(){return T['Day 14 Final'][0].t;},nx:'MSG3_SENT',lbl:'Final Sent'},
  DEMO_SCHEDULE:{d:'Schedule Demo',cp:true,msg:function(){return T['Demo Scheduling'][0].t;},nx:'DEMO_SET',lbl:'Demo Scheduled'},
  BETA_EVALUATE:{d:'Send Beta Invite',cp:true,msg:function(){return T['Beta Cohort'][0].t;},nx:'BETA_INVITED',lbl:'Beta Invited'},
};
function ra(at,role){var a=AE[at];if(!a)return null;return{d:a.d,cp:a.cp,msg:a.cp&&a.msg?a.msg(role):null,nx:a.nx,lbl:a.lbl};}
function sl(s){return STAGE_LABEL[s]||(s?s.replace(/_/g,' '):'');}
function stageCls(s){var m={SOURCED:'cs-src',CONNECTION_SENT:'cs-sent',ACCEPTED:'cs-sent',MSG1_SENT:'cs-sent',MSG2_SENT:'cs-sent',MSG3_SENT:'cs-sent',DEMO_REQUESTED:'cs-demo',DEMO_SCHEDULED:'cs-demo',DEMO_DONE:'cs-demo',BETA_INVITED:'cs-beta',CLOSED:'cs-done'};return m[s]||'cs-src';}
function getMsgForStatus(s,role){var a;if(s==='SOURCED')a=AE['CONNECTION_READY'];else if(s==='CONNECTION_SENT')a=AE['ACCEPTED_CHECK'];else if(s==='ACCEPTED')a=AE['MSG1_SEND'];else if(s==='MSG1_SENT')a=AE['MSG2_FOLLOW'];else if(s==='MSG2_SENT')a=AE['MSG3_FINAL'];else if(s==='DEMO_REQUESTED')a=AE['DEMO_SCHEDULE'];else if(s==='DEMO_DONE')a=AE['BETA_EVALUATE'];if(a&&a.cp&&a.msg)return a.msg(role);return T['First DM'][0].t;}
function hasPH(t){return /\[[A-Z][A-Z _]+\]/.test(t);}
function nextSt(s){const m={SOURCED:'CONNECTION_SENT',CONNECTION_SENT:'ACCEPTED',ACCEPTED:'MSG1_SENT',MSG1_SENT:'MSG2_SENT',MSG2_SENT:'MSG3_SENT',MSG3_SENT:'INTERESTED',DEMO_REQUESTED:'DEMO_SET',DEMO_SCHEDULED:'DEMO_DONE',DEMO_DONE:'BETA_INVITED'};return m[s]||null;}
function nextLbl(s){const m={SOURCED:'Sent ✓',CONNECTION_SENT:'Accepted ✓',ACCEPTED:'DM Sent ✓',MSG1_SENT:'Followed Up ✓',MSG2_SENT:'Final Sent ✓',MSG3_SENT:'Demo Set ✓',DEMO_REQUESTED:'Demo Set ✓',DEMO_SCHEDULED:'Demo Done ✓',DEMO_DONE:'Beta Invited ✓'};return m[s]||'Advance →';}
function stageCls(s){const m={SOURCED:'cs-src',CONNECTION_SENT:'cs-sent',ACCEPTED:'cs-sent',MSG1_SENT:'cs-sent',MSG2_SENT:'cs-sent',MSG3_SENT:'cs-sent',DEMO_REQUESTED:'cs-demo',DEMO_SCHEDULED:'cs-demo',DEMO_DONE:'cs-demo',BETA_INVITED:'cs-beta',CLOSED:'cs-done'};return m[s]||'cs-src';}

function renderMsgs(){

  for(const[grp,tpls]of Object.entries(T)){
    const id='tg-'+grp.replace(/\W/g,'');
    html+=`<div class="tpl-grp">
      <div class="tpl-grp-h" onclick="toggleTplGrp('${id}')">
        <div class="tpl-grp-title">${grp}</div>
        <div class="tpl-grp-meta"><span>${tpls.length}</span><span class="tpl-grp-arrow" id="${id}-arr">▼</span></div>
      </div>
      <div class="tpl-items" id="${id}">`;
    tpls.forEach((t,i)=>{
      const preview=t.t.replace(/\n/g,' ').slice(0,100)+'...';
      html+=`<div class="tpl-row">
        <div class="tpl-info">
          <div class="tpl-label">${t.l}${t.ph?'<span class="tpl-tag">✎ edit</span>':''}</div>
          <div class="tpl-preview">${preview}</div>
        </div>
        <button class="btn btn-copy" data-tkey="${grp}|||${i}" style="min-width:60px">Copy</button>
      </div>`;
    });
    html+='</div></div>';
  }
  el.innerHTML=html;
}
function toggleTplGrp(id){
  const el=document.getElementById(id);const arr=document.getElementById(id+'-arr');
  if(el){el.classList.toggle('open');if(arr)arr.classList.toggle('open');}
}

function renderQueue(pq,feed){
  var el=document.getElementById('pane-queue');

  if(!queue.length&&!ov.length){el.innerHTML='<div class="empty"><div class="empty-ico">→</div><div class="empty-h">Queue empty</div><div class="empty-s">Source prospects, then add via + tab.<br>The queue sequences everything automatically.</div><div class="empty-action" onclick="go(&apos;source&apos;)">🔍 Go to Source</div></div>';return;}

  ov.forEach(function(o){window._pmap[o.id]={msg:null,name:o.prospect||o.type,liUrl:null,status:null,cp:false};});
  queue.forEach(function(p){

    window._pmap[p.id]={msg:a&&a.cp?a.msg:null,name:p.name,liUrl:p.linkedin_url||null,status:p.status,cp:a?a.cp:false,nx:a?a.nx:null};

// ── SWIPE GESTURES ──
function attachSwipe(sel){
  document.querySelectorAll(sel||'.card[data-id]').forEach(el=>{
    let sx=0,sy=0,dx=0,moved=false;
    el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;moved=false;},{passive:true});
    el.addEventListener('touchmove',e=>{
      const cx=e.touches[0].clientX,cy=e.touches[0].clientY;
      dx=cx-sx;const dy=Math.abs(cy-sy);
      if(Math.abs(dx)>dy&&Math.abs(dx)>12){moved=true;el.style.transform=`translateX(${dx}px)`;el.style.opacity=String(1-Math.abs(dx)/220);}
    },{passive:true});
    el.addEventListener('touchend',()=>{
      if(!moved){el.style.transform='';el.style.opacity='';return;}
      const id=parseInt(el.dataset.id);
      if(dx>80)doneAct(id);
      else if(dx<-80)snoozeAct(id);
      else{el.style.transform='';el.style.opacity='';}
    });
  });
}

// ══════════════════════════
// DAILY EXECUTION MODE
// ══════════════════════════
function startDaily(lowEnergy){
  document.getElementById('daily').classList.add('on');
  document.getElementById('dm-body').innerHTML='<div class="loading"><span class="spin"></span>Loading queue...</div>';
  Promise.all([fx('/api/v1/ops/prospects/queue'),fx('/api/v1/ops/feed')]).then(([pq,feed])=>{
    const ov=(feed.data&&feed.data.overdue)||[];
    const q=(pq.data&&pq.data.queue)||[];
    dailyItems=[];
    ov.forEach(o=>dailyItems.push({type:'feed',id:o.id,name:o.prospect||o.type,sub:o.type,msg:null,liUrl:null,status:null,note:null,isOverdue:true}));
    const limit=lowEnergy?2:5;let added=0;
    q.forEach(p=>{
      if(added>=limit)return;
      // Only show in daily if action due within 48h or overdue
      if(p.nextDue&&p.nextDue>(Date.now()+172800000))return;
      dailyItems.push({type:'prospect',id:p.id,name:p.name,role:p.role||'',liUrl:p.linkedin_url||null,status:p.status,note:p.personalisationNote,isOverdue:false,at:p.nextAction,nextDue:p.nextDue});
      added++;
    });
    dailyIdx=0;renderDailyStep();
  });
}
function exitDaily(){document.getElementById('daily').classList.remove('on');}
function renderDailyStep(){
  var el=document.getElementById('dm-body');
  var pct=dailyItems.length?Math.round(dailyIdx/dailyItems.length*100):100;
  document.getElementById('dm-prog').style.width=pct+'%';
  if(dailyIdx>=dailyItems.length){el.innerHTML='<div class="dm-done"><div class="dm-done-ico">✓</div><div class="dm-done-h">Session complete</div><div class="dm-done-s">'+dailyItems.length+' action'+(dailyItems.length!==1?'s':'')+' processed.<br>Return tomorrow.</div></div>';return;}
  var item=dailyItems[dailyIdx];window._dmItem=item;
  var showLow=dailyIdx===0;
  var act=item.at?ra(item.at,item.role):null;
  var disp=act?act.d:sl(item.status);
  var advLbl=act?act.lbl:'✓ Done';
  var html=(showLow?'<button class="dm-low-btn" onclick="exitDaily();startDaily(true)">⚡ Low energy? Minimum cadence (2 actions)</button>':'')
    +'<div class="dm-meta">Action '+(dailyIdx+1)+' of '+dailyItems.length+'</div>'
    +'<div class="dm-step">'+disp+'</div>'
    +'<div class="dm-card"><div class="dm-card-top"><div class="dm-card-name">'+item.name+'</div><div class="dm-card-meta">'+(item.role||'Professional')+'</div></div>'
    +(item.note?'<div class="dm-card-note">'+item.note+'</div>':'')
    +'<div class="dm-actions">';
  if(item.isOverdue)html+='<button class="dm-btn dm-btn-adv" onclick="dmAdv()">✓ Done</button>';
  else if(act){
    if(act.cp&&item.liUrl)html+='<button class="dm-btn dm-btn-both" onclick="dmCpOpen()">📋 Copy + Open LinkedIn ↗</button>';
    else if(act.cp)html+='<button class="dm-btn dm-btn-copy" onclick="dmCpOnly()">📋 Copy Message</button>';
    else html+='<button class="dm-btn dm-btn-open" onclick="dmOpenOnly()">Open LinkedIn ↗</button>';
    if(act.cp&&item.liUrl)html+='<button class="dm-btn dm-btn-open" onclick="dmOpenOnly()">Open LinkedIn Only ↗</button>';
    html+='<div class="dm-row"><button class="dm-btn dm-btn-adv" onclick="dmAdv()">'+advLbl+'</button><button class="dm-btn dm-btn-skip" onclick="dmSkip()">Skip</button></div>';
  }else html+='<div class="dm-row"><button class="dm-btn dm-btn-adv" onclick="dmAdv()">✓ Done</button><button class="dm-btn dm-btn-skip" onclick="dmSkip()">Skip</button></div>';
  html+='</div></div>';el.innerHTML=html;
}

function dmAdv(){
  var item=dailyItems[dailyIdx];
  if(item.type==='feed'){doneAct(item.id);}
  else{var act=item.at?ra(item.at,item.role):null;if(act&&act.nx)advP(item.id,act.nx);else if(item.status){var nx=nextSt(item.status);if(nx)advP(item.id,nx);}}
  dailyIdx++;renderDailyStep();
}
function dmSkip(){dailyIdx++;renderDailyStep();}
function dmCpOpen(){var i=window._dmItem;if(!i)return;var a=i.at?ra(i.at,i.role):null;var m=a&&a.cp?a.msg:null;if(m)cp(m,i.name,i.liUrl||'');else if(i.liUrl)openOnly(i.liUrl);}
function dmCpOnly(){var i=window._dmItem;if(!i)return;var a=i.at?ra(i.at,i.role):null;var m=a&&a.cp?a.msg:null;if(m)cpOnly(m,i.name);}
function dmOpenOnly(){var i=window._dmItem;if(i&&i.liUrl)openOnly(i.liUrl);}


// ── DELEGATED CLICK HANDLER ──
document.addEventListener('click',function(e){
  // Template group copy (data-tkey)
  var tk=e.target.closest('[data-tkey]');
  if(tk){var pts=tk.dataset.tkey.split('|||');var g=pts[0],i=parseInt(pts[1]);if(T[g]&&T[g][i])cpOnly(T[g][i].t,T[g][i].l);return;}
  // Source search (data-skey)
  var sk=e.target.closest('[data-skey]');
  if(sk){var pts=sk.dataset.skey.split('|||');var si=parseInt(pts[0]),sa=pts[1];var s=SEARCHES[si];if(!s)return;
    if(sa==='copy')cpOnly(s.q,s.l);
    else if(sa==='open')openOnly('https://www.linkedin.com/search/results/people/?keywords='+encodeURIComponent(s.q)+'&network=%5B%22S%22%2C%22O%22%5D&origin=FACETED_SEARCH');
    return;}
  // Prospect card actions (data-pid)
  var pb=e.target.closest('[data-pid]');
  if(pb){
    var pid=parseInt(pb.dataset.pid);
    var pa=pb.dataset.pact;
    var pm=window._pmap&&window._pmap[pid];
    if(pa==='cpopen'){
      if(pm&&pm.cp&&pm.msg){cp(pm.msg,pm.name,pm.liUrl||'');}
      else if(pm&&pm.liUrl){openOnly(pm.liUrl);}
      return;
    }
    if(pa==='copy'){if(pm&&pm.cp&&pm.msg)cpOnly(pm.msg,pm.name);return;}
    if(pa==='open'){if(pm&&pm.liUrl)openOnly(pm.liUrl);return;}
    if(pa==='adv'){var nx=pb.dataset.nx||(pm&&pm.nx);if(nx)advP(pid,nx);return;}
    if(pa==='done'){doneAct(pid);return;}
    if(pa==='snooze'){snoozeAct(pid);return;}
    if(pa==='note'){openNotes(pid);return;}
    if(pa==='close'){closeP(pid);return;}
    return;
  }
},true);

// ── INIT ──
document.getElementById('auth-pw').focus();
</script>
