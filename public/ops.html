<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080c14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ADVISIQ · OPS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Syne:wght@400;500;600;700&display=swap');
:root{--bg:#080c14;--s1:#0d1220;--s2:#121829;--b1:#1e2a3a;--b2:#2a3a50;--tx:#e2e8f0;--tm:#94a3b8;--td:#4a5568;--ac:#3b82f6;--ad:#1d4ed8;--ab:#0f1f3d;--gn:#10b981;--gb:#062318;--am:#f59e0b;--ax:#1f1500;--rd:#ef4444;--rb:#1f0a0a;--pu:#a855f7;--pb:#1a0f2a;--mono:'JetBrains Mono',monospace;--sans:'Syne',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* AUTH */
#auth{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;z-index:1000}
.auth-logo{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--td);margin-bottom:40px}.auth-logo span{color:var(--ac)}
.auth-title{font-size:20px;font-weight:600;margin-bottom:6px;text-align:center}.auth-sub{font-size:12px;color:var(--td);margin-bottom:28px;text-align:center;font-family:var(--mono)}
.auth-in{width:100%;max-width:320px;background:var(--s1);border:1px solid var(--b2);border-radius:8px;padding:14px 16px;font-family:var(--mono);font-size:14px;color:var(--tx);outline:none;margin-bottom:10px}
.auth-in:focus{border-color:var(--ac)}.auth-btn{width:100%;max-width:320px;background:var(--ac);border:none;border-radius:8px;padding:14px;font-family:var(--sans);font-size:14px;font-weight:600;color:white;cursor:pointer}
.auth-err{color:var(--rd);font-family:var(--mono);font-size:11px;margin-top:8px}

/* APP */
#app{display:none;height:100vh;flex-direction:column;overflow:hidden}
#app.on{display:flex}

/* TOPBAR */
.topbar{display:flex;align-items:center;padding:10px 14px 8px;border-bottom:1px solid var(--b1);background:var(--bg);flex-shrink:0;gap:8px}
.topbar-logo{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--td);flex:1}.topbar-logo span{color:var(--ac)}
.topbar-time{font-family:var(--mono);font-size:11px;color:var(--td)}
.tbtn{background:none;border:1px solid var(--b2);border-radius:6px;padding:5px 9px;font-family:var(--mono);font-size:10px;color:var(--td);cursor:pointer;flex-shrink:0}
.tbtn:active{background:var(--s1)}
.tbtn-daily{background:var(--ab);border-color:var(--ad);color:var(--ac)}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--b1);background:var(--bg);flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:60px;padding:9px 3px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--td);cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap}
.tab.on{color:var(--ac);border-bottom-color:var(--ac)}.tab-ico{font-size:15px}
.tab-badge{background:var(--rd);color:white;font-size:9px;font-weight:700;border-radius:8px;padding:1px 5px;min-width:16px;text-align:center;display:none}
.tab-badge.on{display:inline-block}

/* SCROLL */
.pane{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 80px}

/* SECTION HEAD */
.sh{padding:12px 12px 6px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--td);display:flex;align-items:center;justify-content:space-between}
.sc{background:var(--s2);border:1px solid var(--b1);border-radius:4px;padding:2px 7px;font-size:10px;color:var(--tm)}

/* BRIEF CARD */
.brief{margin:10px 10px 0;background:var(--ab);border:1px solid var(--ad);border-radius:12px;padding:14px}
.brief-date{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ac);margin-bottom:10px}
.brief-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.bst{background:rgba(0,0,0,.3);border-radius:8px;padding:9px 6px;text-align:center}
.bst-v{font-family:var(--mono);font-size:20px;font-weight:700;line-height:1;color:var(--tx)}.bst-v.rd{color:var(--rd)}.bst-v.gn{color:var(--gn)}.bst-v.am{color:var(--am)}
.bst-l{font-family:var(--mono);font-size:9px;color:var(--td);margin-top:2px;letter-spacing:.06em;text-transform:uppercase}
.brief-lines{display:flex;flex-direction:column;gap:3px}
.brief-line{font-family:var(--mono);font-size:11px;color:var(--tm);padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.brief-line:last-child{border-bottom:none}

/* QUEUE/FEED CARDS */
.qcard{margin:6px 10px 0;border-radius:10px;overflow:hidden;position:relative;transform:translateX(0);transition:transform .2s,opacity .2s}
.qcard.sw-r{transform:translateX(100%);opacity:0}.qcard.sw-l{transform:translateX(-100%);opacity:0}
.qcard-body{padding:11px 12px 8px;display:flex;align-items:flex-start;gap:10px}
.qcard-ico{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-top:1px}
.qcard-info{flex:1;min-width:0}
.qcard-title{font-size:13px;font-weight:600;color:var(--tx);line-height:1.3;margin-bottom:2px}
.qcard-sub{font-family:var(--mono);font-size:10px;color:var(--td);letter-spacing:.03em}
.qcard-note{padding:0 12px 6px;font-size:12px;color:var(--td);line-height:1.4;font-style:italic}
/* chips row */
.qcard-chips{padding:0 12px 8px;display:flex;gap:5px;flex-wrap:wrap}
.qchip{font-family:var(--mono);font-size:10px;padding:5px 11px;border-radius:5px;border:1px solid;cursor:pointer;white-space:nowrap;min-height:32px;display:inline-flex;align-items:center;letter-spacing:.04em}
.qchip:active{opacity:.7}
.qc-copy{background:var(--ab);color:var(--ac);border-color:var(--ad)}
.qc-open{background:rgba(245,158,11,.1);color:var(--am);border-color:#92400e}
.qc-both{background:var(--ab);color:var(--ac);border-color:var(--ad)}
.qc-sent{background:var(--gb);color:var(--gn);border-color:#065f46}
.qc-accepted{background:var(--gb);color:var(--gn);border-color:#065f46}
.qc-demo{background:var(--ax);color:var(--am);border-color:#92400e}
.qc-close{background:var(--rb);color:var(--rd);border-color:#7f1d1d}
.qc-snooze{background:transparent;color:var(--td);border-color:var(--b1)}
/* urgency */
.uc-urgent{background:var(--rb);border:1px solid #7f1d1d}
.uc-today{background:var(--s1);border:1px solid var(--b2)}
.uc-cohort{background:var(--gb);border:1px solid #065f46}
.uc-intel{background:var(--pb);border:1px solid #6b21a8}
.uc-passive{background:var(--s2);border:1px solid var(--b1)}
.ico-urgent{background:rgba(200,60,60,.2)}.ico-action{background:rgba(45,95,138,.25)}.ico-cohort{background:rgba(20,100,70,.2)}

/* PLACEHOLDER WARNING */
.ph-warn{margin:0 12px 8px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:6px;padding:7px 10px;font-family:var(--mono);font-size:10px;color:var(--am);display:none}
.ph-warn.on{display:block}

/* RECENT COPY TRAY */
#copy-tray{position:fixed;bottom:68px;left:8px;right:8px;background:var(--s2);border:1px solid var(--b2);border-radius:10px;padding:10px 12px;z-index:150;display:none;box-shadow:0 8px 32px rgba(0,0,0,.5)}
#copy-tray.on{display:block}
.ct-head{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--td);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.ct-close{cursor:pointer;color:var(--td);font-size:16px;line-height:1}
.ct-item{background:var(--s1);border:1px solid var(--b1);border-radius:6px;padding:8px 10px;margin-bottom:5px;display:flex;align-items:center;gap:8px;cursor:pointer}
.ct-item:last-child{margin-bottom:0}
.ct-item:active{background:var(--ab)}
.ct-label{font-family:var(--mono);font-size:10px;color:var(--ac);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ct-recopy{font-family:var(--mono);font-size:10px;color:var(--td);flex-shrink:0}

/* NOTES MODAL */
#notes-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:flex-end}
#notes-modal.on{display:flex}
.notes-sheet{background:var(--s1);border-radius:16px 16px 0 0;padding:20px 16px 32px;width:100%;border-top:1px solid var(--b2)}
.notes-title{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ac);margin-bottom:12px}
.notes-in{width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:8px;padding:12px;color:var(--tx);font-family:var(--mono);font-size:13px;outline:none;resize:none;height:80px}
.notes-in:focus{border-color:var(--ac)}
.notes-btns{display:flex;gap:8px;margin-top:10px}
.notes-save{flex:1;background:var(--ac);border:none;border-radius:7px;padding:12px;font-family:var(--sans);font-size:13px;font-weight:600;color:white;cursor:pointer}
.notes-cancel{background:transparent;border:1px solid var(--b2);border-radius:7px;padding:12px 16px;font-family:var(--mono);font-size:12px;color:var(--td);cursor:pointer}

/* DAILY MODE */
#daily-mode{position:fixed;inset:0;background:var(--bg);z-index:300;display:none;flex-direction:column}
#daily-mode.on{display:flex}
.dm-bar{background:var(--s1);border-bottom:1px solid var(--b1);padding:12px 16px;display:flex;align-items:center;gap:10px}
.dm-title{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ac);flex:1}
.dm-exit{font-family:var(--mono);font-size:10px;background:transparent;border:1px solid var(--b2);border-radius:6px;padding:6px 12px;color:var(--td);cursor:pointer}
.dm-progress{height:3px;background:var(--b1);flex-shrink:0}
.dm-prog-fill{height:100%;background:var(--ac);transition:width .3s ease}
.dm-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
.dm-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--td);margin-bottom:8px}
.dm-count{font-family:var(--mono);font-size:14px;color:var(--tm);margin-bottom:24px}
.dm-card{background:var(--s1);border:1px solid var(--b2);border-radius:12px;width:100%;max-width:400px;overflow:hidden}
.dm-card-head{padding:14px 16px;border-bottom:1px solid var(--b1)}
.dm-name{font-size:16px;font-weight:600;color:var(--tx)}
.dm-meta{font-family:var(--mono);font-size:11px;color:var(--td);margin-top:3px}
.dm-note{padding:10px 16px;font-size:13px;color:var(--td);border-bottom:1px solid var(--b1);font-style:italic}
.dm-actions{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.dm-copy{background:var(--ac);border:none;border-radius:8px;padding:13px;font-family:var(--sans);font-size:14px;font-weight:600;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.dm-open{background:rgba(245,158,11,.1);border:1px solid #92400e;border-radius:8px;padding:11px;font-family:var(--mono);font-size:12px;color:var(--am);cursor:pointer;text-align:center}
.dm-row{display:flex;gap:8px}
.dm-sent{flex:1;background:var(--gb);border:1px solid #065f46;border-radius:8px;padding:11px;font-family:var(--mono);font-size:12px;color:var(--gn);cursor:pointer;text-align:center}
.dm-skip{background:transparent;border:1px solid var(--b2);border-radius:8px;padding:11px 16px;font-family:var(--mono);font-size:12px;color:var(--td);cursor:pointer}
.dm-done{padding:32px 16px;text-align:center}
.dm-done-ico{font-size:40px;margin-bottom:12px}
.dm-done-title{font-size:18px;font-weight:600;color:var(--gn);margin-bottom:6px}
.dm-done-sub{font-family:var(--mono);font-size:11px;color:var(--td);line-height:1.6}
/* LOW ENERGY MODE */
.dm-low{background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.2);border-radius:8px;padding:11px;font-family:var(--mono);font-size:11px;color:var(--am);cursor:pointer;text-align:center;margin-bottom:12px}

/* TEMPLATE ENGINE */
.tpl-group{margin:6px 10px 0;background:var(--s1);border:1px solid var(--b2);border-radius:10px;overflow:hidden}
.tpl-group-head{padding:9px 14px;background:var(--ab);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b2)}
.tpl-group-title{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ac);letter-spacing:.08em;text-transform:uppercase}
.tpl-group-count{font-family:var(--mono);font-size:10px;color:var(--td)}
.tpl-item{padding:11px 14px;border-bottom:1px solid var(--b1);display:flex;align-items:flex-start;gap:10px}
.tpl-item:last-child{border-bottom:none}
.tpl-info{flex:1;min-width:0}
.tpl-label{font-family:var(--mono);font-size:10px;color:var(--ac);margin-bottom:4px;letter-spacing:.06em;text-transform:uppercase}
.tpl-preview{font-size:12px;color:var(--tm);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tpl-copy-btn{font-family:var(--mono);font-size:10px;padding:6px 11px;border-radius:5px;background:var(--ab);color:var(--ac);border:1px solid var(--ad);cursor:pointer;white-space:nowrap;flex-shrink:0;min-height:32px;display:flex;align-items:center}

/* SOURCE GUIDE */
.sguide{margin:6px 10px 0;background:var(--s1);border:1px solid var(--b2);border-radius:10px;overflow:hidden}
.sguide-h{padding:9px 14px;background:rgba(16,185,129,.08);border-bottom:1px solid var(--b2);display:flex;align-items:center;gap:8px}
.sguide-title{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--gn);letter-spacing:.08em;text-transform:uppercase}
.sguide-item{padding:11px 14px;border-bottom:1px solid var(--b1)}
.sguide-item:last-child{border-bottom:none}
.sguide-label{font-family:var(--mono);font-size:10px;color:var(--gn);margin-bottom:4px;letter-spacing:.06em}
.sguide-query{font-family:var(--mono);font-size:12px;color:var(--tx);line-height:1.5;margin-bottom:6px}
.sguide-note{font-size:12px;color:var(--td);line-height:1.4}

/* TRAFFIC */
.tcard{margin:6px 10px 0;background:var(--s1);border:1px solid var(--b2);border-radius:10px;padding:14px}
.tcard-title{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--td);margin-bottom:12px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
.tst{background:var(--s2);border-radius:7px;padding:10px 12px}.tst-v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--tx);line-height:1}.tst-l{font-family:var(--mono);font-size:9px;color:var(--td);margin-top:3px;letter-spacing:.06em;text-transform:uppercase}
.sbars{display:flex;flex-direction:column;gap:6px}
.sbar{display:flex;align-items:center;gap:8px}
.sbar-l{font-family:var(--mono);font-size:10px;color:var(--td);width:68px;flex-shrink:0}
.sbar-t{flex:1;height:6px;background:var(--b1);border-radius:3px;overflow:hidden}
.sbar-f{height:100%;border-radius:3px;transition:width .5s ease}
.fl{background:var(--ac)}.fw{background:var(--gn)}.fd{background:var(--td)}.fo{background:var(--am)}
.sbar-v{font-family:var(--mono);font-size:10px;color:var(--tm);width:20px;text-align:right;flex-shrink:0}

/* ADD FORM */
.aform{margin:6px 10px 0;background:var(--s1);border:1px solid var(--b2);border-radius:10px;padding:14px}
.aform-title{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--td);margin-bottom:12px}
.ff{margin-bottom:10px}
.fl-label{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--td);margin-bottom:4px;display:block}
.fi,.fsel{width:100%;background:var(--s2);border:1px solid var(--b2);border-radius:7px;padding:10px 12px;color:var(--tx);font-family:var(--mono);font-size:12px;outline:none}
.fi:focus,.fsel:focus{border-color:var(--ac)}.fsel{appearance:none;cursor:pointer}
.fsel-wrap{position:relative}.fsel-wrap::after{content:'▾';position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--td);pointer-events:none;font-size:12px}
.fbtn{width:100%;background:var(--ac);border:none;border-radius:7px;padding:13px;font-family:var(--sans);font-size:13px;font-weight:600;color:white;cursor:pointer;margin-top:4px}
.fbtn:active{background:var(--ad)}

/* STICKY */
.sticky{position:fixed;bottom:0;left:0;right:0;background:rgba(13,18,32,.95);border-top:1px solid var(--b2);padding:9px 14px;display:none;align-items:center;gap:10px;z-index:50;backdrop-filter:blur(12px)}
.sticky.on{display:flex}
.sticky-txt{flex:1;font-size:12px;color:var(--tm);font-family:var(--mono)}
.sticky-cta{background:var(--ac);border:none;border-radius:7px;padding:8px 14px;font-family:var(--sans);font-size:12px;font-weight:600;color:white;cursor:pointer;white-space:nowrap}

/* TOAST */
#toast{position:fixed;bottom:66px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--s2);border:1px solid var(--b2);border-radius:8px;padding:9px 16px;font-family:var(--mono);font-size:11px;color:var(--tx);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;z-index:400}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{padding:32px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--td);letter-spacing:.08em}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--b2);border-top-color:var(--ac);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:44px 24px;text-align:center}
.empty-ico{font-size:32px;margin-bottom:12px;opacity:.4}.empty-title{font-size:15px;font-weight:600;color:var(--tm);margin-bottom:6px}
.empty-sub{font-family:var(--mono);font-size:11px;color:var(--td);line-height:1.6}
.swipe-hint{display:flex;align-items:center;justify-content:space-between;padding:3px 12px;font-family:var(--mono);font-size:9px;color:var(--td);letter-spacing:.06em;opacity:.5}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth">
  <div class="auth-logo"><span>ADVISIQ</span> · OPS</div>
  <div class="auth-title">Commercialization Console</div>
  <div class="auth-sub">founder access only</div>
  <input class="auth-in" type="password" id="auth-pw" placeholder="ops password" autocomplete="current-password">
  <button class="auth-btn" onclick="doAuth()">Access Console</button>
  <div class="auth-err" id="auth-err"></div>
</div>

<!-- RECENT COPY TRAY -->
<div id="copy-tray">
  <div class="ct-head">Recent Copies <span class="ct-close" onclick="document.getElementById('copy-tray').classList.remove('on')">×</span></div>
  <div id="copy-tray-items"></div>
</div>

<!-- NOTES MODAL -->
<div id="notes-modal">
  <div class="notes-sheet">
    <div class="notes-title">Post-Demo Field Note</div>
    <textarea class="notes-in" id="notes-in" placeholder="Key objection · strongest reaction · follow-up commitment..."></textarea>
    <div class="notes-btns">
      <button class="notes-cancel" onclick="closeNotes()">Cancel</button>
      <button class="notes-save" onclick="saveNotes()">Save Note</button>
    </div>
  </div>
</div>

<!-- DAILY MODE -->
<div id="daily-mode">
  <div class="dm-bar">
    <div class="dm-title">Daily Execution Session</div>
    <button class="dm-exit" onclick="exitDaily()">Exit ×</button>
  </div>
  <div class="dm-progress"><div class="dm-prog-fill" id="dm-prog" style="width:0%"></div></div>
  <div class="dm-body" id="dm-body">
    <div class="loading"><span class="spin"></span>Loading queue...</div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-logo"><span>ADVISIQ</span> · OPS</div>
    <div class="topbar-time" id="clock"></div>

<script>
const API='';let AUTH='';let CUR='feed';
// Recent copies — last 3
let recentCopies=[];
// Notes state
let noteProspectId=null;
// Daily mode state
let dailyItems=[],dailyIdx=0,dailyLow=false;
// Last tab for session recovery
function saveTab(t){try{sessionStorage.setItem('ops_tab',t);}catch(e){}}
function getLastTab(){try{return sessionStorage.getItem('ops_tab')||'feed';}catch(e){return'feed';}}

// ── AUTH ──
function doAuth(){
  const pw=document.getElementById('auth-pw').value;if(!pw)return;AUTH=pw;
  fx('/api/v1/ops/brief').then(d=>{
    if(d.status==='OK'){
      document.getElementById('auth').style.display='none';
      document.getElementById('app').classList.add('on');
      const lt=getLastTab();loadAll();go(lt);tick();setInterval(tick,30000);
    }else showErr('Invalid password');
  }).catch(()=>showErr('Connection failed'));
}
function showErr(m){document.getElementById('auth-err').textContent=m;AUTH='';}
document.getElementById('auth-pw').addEventListener('keydown',e=>{if(e.key==='Enter')doAuth();});
function tick(){const n=new Date();document.getElementById('clock').textContent=n.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});}

// ── FETCH ──
function fx(url,opts={}){return fetch(API+url,{...opts,headers:{'x-ops-auth':AUTH,'Content-Type':'application/json',...(opts.headers||{})}}).then(r=>r.json());}

// ── TOAST ──
function toast(m,ms=1800){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),ms);}

// ── COPY WITH PLACEHOLDER GUARD ──
function cp(text,label,liUrl){
  const hasPlaceholder=/\[[A-Z_ ]+\]/.test(text);
  if(hasPlaceholder){
    const ok=confirm('Message contains unfilled placeholders:\n'+text.match(/\[[A-Z_ ]+\]/g).join(', ')+'\n\nCopy anyway?');
    if(!ok)return;
  }
  navigator.clipboard.writeText(text).then(()=>{
    afterCopy(text,label);
    if(liUrl)setTimeout(()=>openLI(liUrl),300);
    else toast('📋 Copied — '+label);
  }).catch(()=>{
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    afterCopy(text,label);
    if(liUrl)setTimeout(()=>openLI(liUrl),300);
    else toast('📋 Copied — '+label);
  });
}
function afterCopy(text,label){
  // Add to recent copies tray (max 3)
  recentCopies=recentCopies.filter(r=>r.label!==label);
  recentCopies.unshift({text,label});
  if(recentCopies.length>3)recentCopies.pop();
  renderTray();
  if(!document.getElementById('copy-tray').classList.contains('on'))toast('📋 Copied — '+label);
}
function openLI(url){if(url&&url.startsWith('http'))window.open(url,'_blank');}

// ── COPY TRAY ──
function toggleTray(){document.getElementById('copy-tray').classList.toggle('on');renderTray();}
function renderTray(){
  const el=document.getElementById('copy-tray-items');
  if(!recentCopies.length){el.innerHTML='<div style="font-family:var(--mono);font-size:11px;color:var(--td);text-align:center;padding:8px">No recent copies</div>';return;}
  el.innerHTML=recentCopies.map((r,i)=>`<div class="ct-item" onclick="reCopy(${i})"><div class="ct-label">${r.label}</div><div class="ct-recopy">Re-copy</div></div>`).join('');
}
function reCopy(i){
  const r=recentCopies[i];if(!r)return;
  navigator.clipboard.writeText(r.text).catch(()=>{const ta=document.createElement('textarea');ta.value=r.text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);});
  toast('📋 Re-copied — '+r.label);
  document.getElementById('copy-tray').classList.remove('on');
}

// ── NAV ──
function go(tab){
  CUR=tab;saveTab(tab);
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab));
  document.querySelectorAll('.pane').forEach(p=>p.style.display='none');
  document.getElementById('pane-'+tab).style.display='block';
  document.getElementById('sticky').classList.remove('on');
  document.getElementById('copy-tray').classList.remove('on');
  if(tab==='feed')loadFeed();
  else if(tab==='queue')loadQueue();
  else if(tab==='templates')renderTemplates();
  else if(tab==='source')renderSource();
  else if(tab==='prospects')loadProspects();
  else if(tab==='traffic')loadTraffic();
  else if(tab==='add')renderAdd();
}
function loadAll(){loadFeed();loadQueue();loadProspects();loadTraffic();}

// ══════════════════════════════════

function renderTemplates(){
  const el=document.getElementById('pane-templates');

// ══════════════════════════════════
// OUTREACH QUEUE
// ══════════════════════════════════
function loadQueue(){
  Promise.all([fx('/api/v1/ops/prospects/queue'),fx('/api/v1/ops/feed')]).then(([pq,feed])=>{
    renderQueue(pq,feed);
    const ct=(pq.data&&pq.data.count)||0;
    const b=document.getElementById('b-queue');b.textContent=ct;b.classList.toggle('on',ct>0);
  }).catch(()=>{
    document.getElementById('pane-queue').innerHTML='<div class="empty"><div class="empty-ico">→</div><div class="empty-title">Queue empty</div><div class="empty-sub">Add prospects via the + tab</div></div>';
  });
}

function renderQueue(pq,feed){
  const el=document.getElementById('pane-queue');
  const queue=(pq.data&&pq.data.queue)||[];
  const overdue=(feed&&feed.data&&feed.data.overdue)||[];
  if(queue.length===0&&overdue.length===0){el.innerHTML='<div class="empty"><div class="empty-ico">→</div><div class="empty-title">Queue empty</div><div class="empty-sub">Add prospects using the + tab<br>Return here to execute outreach</div></div>';return;}
  let html='';
  if(overdue.length>0){
    html+=`<div class="sh">⚡ Overdue <span class="sc">${overdue.length}</span></div>`;
    html+='<div class="swipe-hint"><span>← snooze</span><span>done →</span></div>';
    overdue.forEach(item=>{const hrs=Math.floor((item.overdueMs||0)/3600000);html+=qCard({id:item.id,name:item.prospect||item.type,sub:item.type,urgency:'urgent',liUrl:null,msg:null,status:null,note:null,overdueHrs:hrs});});
  }
  const stages={SOURCED:'Ready to Connect',CONNECTION_SENT:'Awaiting Acceptance',ACCEPTED:'Send First DM',MSG1_SENT:'Day 7 Follow-Up',MSG2_SENT:'Day 14 Final',DEMO_REQUESTED:'Schedule Demo',DEMO_SCHEDULED:'Demo Upcoming',DEMO_DONE:'Post-Demo Follow-Up',BETA_INVITED:'Onboard to Cohort'};
  const grouped={};
  queue.forEach(p=>{const g=stages[p.status]||p.status;if(!grouped[g])grouped[g]=[];grouped[g].push(p);});
  for(const[stage,prospects]of Object.entries(grouped)){
    html+=`<div class="sh">${stage} <span class="sc">${prospects.length}</span></div>`;
    prospects.forEach(p=>{
      const msg=getMsgForStatus(p.status);
      html+=qCard({id:p.id,name:p.name,sub:(p.role||'Professional')+' · Score '+(p.score||2),urgency:'today',liUrl:p.linkedin_url||null,msg,status:p.status,note:p.personalisationNote});
    });
  }
  el.innerHTML=html;
  attachSwipe('.qcard');
}

function qCard({id,name,sub,urgency,liUrl,msg,status,note,overdueHrs}){
  const cls={urgent:'uc-urgent',today:'uc-today',cohort:'uc-cohort'}[urgency]||'uc-passive';
  const initials=name?name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2):'?';
  let chips='';
  if(msg){
    const hasVars=/\[[A-Z_ ]+\]/.test(msg);
    // Combined copy+open is the primary action
    if(liUrl){
      chips+=`<div class="qchip qc-both" onclick='cp(${JSON.stringify(msg)},"${name}","${liUrl}")'>📋 Copy + Open ↗</div>`;
      chips+=`<div class="qchip qc-open" onclick="openLI('${liUrl}')">Open ↗</div>`;
    }else{
      chips+=`<div class="qchip qc-copy" onclick='cp(${JSON.stringify(msg)},"${name}")'>📋 Copy Msg</div>`;
    }
    if(hasVars)chips+=`<div style="width:100%;font-family:var(--mono);font-size:10px;color:var(--am);padding:2px 0">⚠ Edit [BRACKETS] before sending</div>`;
  }else if(liUrl){
    chips+=`<div class="qchip qc-open" onclick="openLI('${liUrl}')">Open LinkedIn ↗</div>`;
  }
  if(status){
    const nx=nextStatus(status);
    const lbl=nextLabel(status);
    if(nx)chips+=`<div class="qchip qc-sent" onclick="advP(${id},'${nx}')">${lbl}</div>`;
    if(status==='DEMO_DONE')chips+=`<div class="qchip" style="background:var(--pb);color:var(--pu);border-color:#6b21a8;font-family:var(--mono);font-size:10px;padding:5px 11px;border-radius:5px;cursor:pointer" onclick="openNotes(${id})">📝 Note</div>`;
  }else if(overdueHrs!==undefined){
    chips+=`<div class="qchip qc-sent" onclick="doneAct(${id})">✓ Done</div>`;
    chips+=`<div class="qchip qc-snooze" onclick="snoozeAct(${id})">+24h</div>`;
  }
  chips+=`<div class="qchip qc-close" onclick="closeP(${id})">Close</div>`;
  return `<div class="qcard ${cls}" id="qc-${id}" data-id="${id}">
    <div class="qcard-body">
      <div class="qcard-ico ico-action" style="background:var(--ab);font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ac)">${initials}</div>
      <div class="qcard-info">
        <div class="qcard-title">${name}${overdueHrs!==undefined?' — '+overdueHrs+'h overdue':''}</div>
        <div class="qcard-sub">${sub}</div>
      </div>
    </div>
    ${note?`<div class="qcard-note">${note}</div>`:''}
    <div class="qcard-chips">${chips}</div>
  </div>`;
}

function getMsgForStatus(status){
  const map={SOURCED:TEMPLATES['Connection Request'][0].text,CONNECTION_SENT:TEMPLATES['Connection Request'][0].text,ACCEPTED:TEMPLATES['First DM'][0].text,MSG1_SENT:TEMPLATES['Day 7 Follow-Up'][0].text,MSG2_SENT:TEMPLATES['Day 14 Final'][0].text,DEMO_REQUESTED:TEMPLATES['Demo Scheduling'][0].text,DEMO_SCHEDULED:TEMPLATES['Demo Scheduling'][1].text,DEMO_DONE:TEMPLATES['Post-Demo'][0].text,BETA_INVITED:TEMPLATES['Beta Cohort'][1].text};
  return map[status]||TEMPLATES['First DM'][0].text;
}
function nextStatus(s){const m={SOURCED:'CONNECTION_SENT',CONNECTION_SENT:'ACCEPTED',ACCEPTED:'MSG1_SENT',MSG1_SENT:'MSG2_SENT',MSG2_SENT:'MSG3_SENT',MSG3_SENT:'INTERESTED',DEMO_REQUESTED:'DEMO_SET',DEMO_SCHEDULED:'DEMO_DONE',DEMO_DONE:'BETA_INVITED'};return m[s]||null;}
function nextLabel(s){const m={SOURCED:'Sent ✓',CONNECTION_SENT:'Accepted ✓',ACCEPTED:'DM Sent ✓',MSG1_SENT:'Followed Up ✓',MSG2_SENT:'Final Sent ✓',MSG3_SENT:'Demo Set ✓',DEMO_REQUESTED:'Demo Set ✓',DEMO_SCHEDULED:'Demo Done ✓',DEMO_DONE:'Beta Invited ✓'};return m[s]||'Advance →';}
function advP(id,action){fx('/api/v1/ops/prospects/'+id+'/action',{method:'POST',body:JSON.stringify({action})}).then(d=>{if(d.status==='OK'){toast('→ '+action.replace(/_/g,' '));loadQueue();loadProspects();}else toast('Error: '+d.error);});}
function closeP(id){if(!confirm('Close this prospect?'))return;fx('/api/v1/ops/prospects/'+id+'/action',{method:'POST',body:JSON.stringify({action:'CLOSED'})}).then(()=>{toast('Closed');loadQueue();loadProspects();});}

function closeNotes(){document.getElementById('notes-modal').classList.remove('on');noteProspectId=null;}
function saveNotes(){

  dailyLow=!!lowEnergy;

  Promise.all([fx('/api/v1/ops/prospects/queue'),fx('/api/v1/ops/feed')]).then(([pq,feed])=>{
    const overdue=(feed.data&&feed.data.overdue)||[];
    const queue=(pq.data&&pq.data.queue)||[];
    // Build ordered item list
    dailyItems=[];
    // Always: overdue first
    overdue.forEach(o=>dailyItems.push({type:'feed',id:o.id,name:o.prospect||o.type,sub:o.type,msg:null,liUrl:null,status:null,overdue:true}));
    const targetCount=dailyLow?2:5;
    let added=0;
    queue.forEach(p=>{
      if(added>=targetCount)return;
      dailyItems.push({type:'prospect',id:p.id,name:p.name,sub:(p.role||'')+' · '+((p.status||'').replace(/_/g,' ')),msg:getMsgForStatus(p.status),liUrl:p.linkedin_url||null,status:p.status,note:p.personalisationNote,overdue:false});
      added++;
    });
    dailyIdx=0;
    renderDailyItem();
  });
}
function exitDaily(){document.getElementById('daily-mode').classList.remove('on');}
function renderDailyItem(){
  const el=document.getElementById('dm-body');
  if(dailyIdx>=dailyItems.length){
    el.innerHTML=`<div class="dm-done"><div class="dm-done-ico">${dailyLow?'⚡':'✓'}</div><div class="dm-done-title">${dailyLow?'Minimum cadence complete':'Daily session complete'}</div><div class="dm-done-sub">All ${dailyItems.length} action${dailyItems.length!==1?'s':''} processed.<br>Return tomorrow.</div></div>`;
    document.getElementById('dm-prog').style.width='100%';
    return;
  }
  const item=dailyItems[dailyIdx];
  const pct=Math.round(dailyIdx/Math.max(dailyItems.length,1)*100);
  document.getElementById('dm-prog').style.width=pct+'%';
  const hasVars=item.msg&&/\[[A-Z_ ]+\]/.test(item.msg);
  el.innerHTML=`
    ${dailyIdx===0&&!dailyLow?`<div class="dm-low" onclick="exitDaily();startDaily(true)">⚡ Low energy? Switch to minimum cadence (2 actions)</div>`:''}
    <div class="dm-label">Action ${dailyIdx+1} of ${dailyItems.length}</div>
    <div class="dm-count">${item.overdue?'⚡ Overdue':item.status?item.status.replace(/_/g,' '):'Outreach'}</div>
    <div class="dm-card">
      <div class="dm-card-head">
        <div class="dm-name">${item.name}</div>
        <div class="dm-meta">${item.sub}</div>
      </div>
      ${item.note?`<div class="dm-note">${item.note}</div>`:''}
      <div class="dm-actions">
        ${hasVars?`<div style="background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:6px;padding:7px 10px;font-family:var(--mono);font-size:10px;color:var(--am);margin-bottom:4px">⚠ Edit [BRACKETS] before sending</div>`:''}
        ${item.msg?`<button class="dm-copy" onclick="cp(${JSON.stringify(item.msg)},'${item.name}')">📋 Copy Message</button>`:''}
        ${item.liUrl?`<button class="dm-open" onclick="openLI('${item.liUrl}')">Open LinkedIn Profile ↗</button>`:''}
        ${item.msg&&item.liUrl?`<button class="dm-copy" style="background:var(--ab);border:1px solid var(--ad)" onclick="cp(${JSON.stringify(item.msg)},'${item.name}','${item.liUrl}')">📋 Copy + Open ↗</button>`:''}
        <div class="dm-row">
          <button class="dm-sent" onclick="dmAdvance()">${item.overdue?'✓ Done':nextLabel(item.status)||'Sent ✓'}</button>
          <button class="dm-skip" onclick="dmSkip()">Skip</button>
        </div>
      </div>
    </div>`;
}
function dmAdvance(){
  const item=dailyItems[dailyIdx];
  if(item.type==='feed'){doneAct(item.id);}
  else if(item.status){const nx=nextStatus(item.status);if(nx)advP(item.id,nx);}
  dailyIdx++;renderDailyItem();
}
function dmSkip(){dailyIdx++;renderDailyItem();}

// ══════════════════════════════════
// FEED TAB
// ══════════════════════════════════
function loadFeed(){
  Promise.all([fx('/api/v1/ops/brief'),fx('/api/v1/ops/feed')]).then(([brief,feed])=>{
    renderFeed(brief,feed);
    const oc=(feed.data&&feed.data.counts&&feed.data.counts.overdue)||0;
    const b=document.getElementById('b-feed');b.textContent=oc;b.classList.toggle('on',oc>0);
    updateSticky(feed);
  }).catch(e=>{document.getElementById('pane-feed').innerHTML='<div class="empty"><div class="empty-ico">⚠</div><div class="empty-title">Load failed</div><div class="empty-sub">'+e.message+'</div></div>';});
}
function renderFeed(brief,feed){
  const el=document.getElementById('pane-feed');
  let html='';
  const d=brief.data||{};const oc=d.overdueCount||0,pe=d.pendingEvents||0,yv=d.yesterdayUniqueCount||0;
  const now=new Date();
  html+=`<div class="brief">
    <div class="brief-date">${now.toLocaleDateString('en-IN',{weekday:'long'})} · ${now.toLocaleDateString('en-IN',{day:'numeric',month:'short'})} · Operational Brief</div>
    <div class="brief-stats">
      <div class="bst"><div class="bst-v ${oc>0?'rd':'gn'}">${oc}</div><div class="bst-l">Overdue</div></div>
      <div class="bst"><div class="bst-v ${pe>0?'am':''}">${pe}</div><div class="bst-l">Events</div></div>
      <div class="bst"><div class="bst-v ${yv>0?'gn':''}">${yv}</div><div class="bst-l">Visitors</div></div>
    </div>
    <div class="brief-lines">${(d.lines||[]).map(l=>`<div class="brief-line">${l}</div>`).join('')}</div>
  </div>`;
  const fd=feed.data||{};const overdue=fd.overdue||[],today=fd.today||[],events=fd.events||[];
  if(overdue.length>0){
    html+=`<div class="sh">⚡ Overdue <span class="sc">${overdue.length}</span></div>`;
    html+='<div class="swipe-hint"><span>← snooze</span><span>done →</span></div>';
    overdue.forEach(item=>{const hrs=Math.floor((item.overdueMs||0)/3600000);html+=`<div class="qcard uc-urgent" id="fi-${item.id}" data-id="${item.id}"><div class="qcard-body"><div class="qcard-ico ico-urgent">⚡</div><div class="qcard-info"><div class="qcard-title">${item.prospect||item.type} — ${hrs}h overdue</div><div class="qcard-sub">${item.type}</div></div></div><div class="qcard-chips"><div class="qchip qc-sent" onclick="doneAct(${item.id})">✓ Done</div><div class="qchip qc-snooze" onclick="snoozeAct(${item.id})">+24h</div><div class="qchip qc-close" onclick="dismissAct(${item.id})">Dismiss</div></div></div>`;});
  }
  if(today.length>0){
    html+=`<div class="sh">Today <span class="sc">${today.length}</span></div>`;
    today.forEach(item=>{html+=`<div class="qcard uc-today" id="fi-${item.id}" data-id="${item.id}"><div class="qcard-body"><div class="qcard-ico ico-action">${actIcon(item.type)}</div><div class="qcard-info"><div class="qcard-title">${item.prospect||item.type}</div><div class="qcard-sub">${item.type}</div></div></div><div class="qcard-chips"><div class="qchip qc-sent" onclick="doneAct(${item.id})">✓ Done</div><div class="qchip qc-snooze" onclick="snoozeAct(${item.id})">+24h</div><div class="qchip qc-close" onclick="dismissAct(${item.id})">Dismiss</div></div></div>`;});
  }
  if(events.length>0){
    html+=`<div class="sh">Events <span class="sc">${events.length}</span></div>`;
    events.forEach(ev=>{html+=`<div class="qcard uc-cohort"><div class="qcard-body"><div class="qcard-ico ico-cohort">🔔</div><div class="qcard-info"><div class="qcard-title">${ev.title}</div><div class="qcard-sub">${ev.body}</div></div></div></div>`;});
  }
  if(overdue.length===0&&today.length===0&&events.length===0){html+=`<div class="empty"><div class="empty-ico">✓</div><div class="empty-title">All clear</div><div class="empty-sub">Nothing pending.<br>Tap ▶ Daily to run your outreach batch.</div></div>`;}
  el.innerHTML=html;attachSwipe('#pane-feed .qcard');
}
function actIcon(t){const m={CONNECTION_READY:'→',CONNECTION_SENT:'→',ACCEPTED_CHECK:'◎',MSG1_SEND:'✉',MSG2_FOLLOW:'↩',MSG3_FINAL:'◈',DEMO_SCHEDULE:'📅',BETA_EVALUATE:'⭐'};return m[t]||'→';}
function doneAct(id){const el=document.getElementById('fi-'+id)||document.getElementById('qc-'+id);if(el){el.classList.add('sw-r');setTimeout(()=>el.remove(),220);}fx('/api/v1/ops/feed/'+id+'/act',{method:'POST',body:JSON.stringify({action:'COMPLETE'})}).then(()=>{toast('✓ Done');setTimeout(loadFeed,400);});}
function snoozeAct(id){const el=document.getElementById('fi-'+id)||document.getElementById('qc-'+id);if(el){el.classList.add('sw-l');setTimeout(()=>el.remove(),220);}fx('/api/v1/ops/feed/'+id+'/act',{method:'POST',body:JSON.stringify({action:'SNOOZE_24H'})}).then(()=>toast('Snoozed 24h'));}
function dismissAct(id){const el=document.getElementById('fi-'+id)||document.getElementById('qc-'+id);if(el){el.classList.add('sw-l');setTimeout(()=>el.remove(),220);}fx('/api/v1/ops/feed/'+id+'/act',{method:'POST',body:JSON.stringify({action:'DISMISS'})}).then(()=>toast('Dismissed'));}
function attachSwipe(sel){
  document.querySelectorAll(sel||'.qcard[data-id]').forEach(el=>{
    let sx=0,sy=0,dx=0;
    el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;},{passive:true});
    el.addEventListener('touchmove',e=>{dx=e.touches[0].clientX-sx;const dy=Math.abs(e.touches[0].clientY-sy);if(Math.abs(dx)>dy&&Math.abs(dx)>10){el.style.transform=`translateX(${dx}px)`;el.style.opacity=1-Math.abs(dx)/200;}},{passive:true});
    el.addEventListener('touchend',()=>{const id=parseInt(el.dataset.id);if(dx>80)doneAct(id);else if(dx<-80)snoozeAct(id);else{el.style.transform='';el.style.opacity='';}});
  });
}
function updateSticky(feed){
  const fd=feed.data||{};const ov=fd.overdue||[];const td=fd.today||[];
  const st=document.getElementById('sticky');if(CUR!=='feed'){st.classList.remove('on');return;}
  if(ov.length>0){document.getElementById('sticky-txt').textContent='⚡ '+(ov[0].prospect||ov[0].type)+' overdue';document.getElementById('sticky-cta').onclick=()=>doneAct(ov[0].id);st.classList.add('on');}
  else if(td.length>0){document.getElementById('sticky-txt').textContent='→ Next: '+(td[0].prospect||td[0].type);document.getElementById('sticky-cta').onclick=()=>doneAct(td[0].id);st.classList.add('on');}
  else st.classList.remove('on');
}

// ══════════════════════════════════
// PROSPECTS (PIPELINE)
// ══════════════════════════════════
function loadProspects(){
  fx('/api/v1/ops/prospects/queue').then(data=>{
    renderProspects(data);
    const ct=(data.data&&data.data.count)||0;
    const b=document.getElementById('b-prospects');b.textContent=ct;b.classList.toggle('on',ct>0);
  }).catch(()=>{document.getElementById('pane-prospects').innerHTML='<div class="empty"><div class="empty-ico">◎</div><div class="empty-title">No prospects yet</div><div class="empty-sub">Add via + tab</div></div>';});
}
function renderProspects(data){
  const el=document.getElementById('pane-prospects');
  const queue=(data.data&&data.data.queue)||[];
  if(queue.length===0){el.innerHTML='<div class="empty"><div class="empty-ico">◎</div><div class="empty-title">Pipeline empty</div><div class="empty-sub">Add first prospect via the + tab</div></div>';return;}
  let html=`<div class="sh">Pipeline <span class="sc">${queue.length}</span></div>`;
  queue.forEach(p=>{
    const initials=p.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
    const msg=getMsgForStatus(p.status);
    const hasVars=msg&&/\[[A-Z_ ]+\]/.test(msg);
    html+=`<div class="qcard uc-today">
      <div class="qcard-body">
        <div class="qcard-ico ico-action" style="background:var(--ab);font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ac)">${initials}</div>
        <div class="qcard-info">
          <div class="qcard-title">${p.name}</div>
          <div class="qcard-sub">${p.role||'Professional'} · Score ${p.score||2} · ${(p.status||'SOURCED').replace(/_/g,' ')}</div>
        </div>
      </div>
      ${p.personalisationNote?`<div class="qcard-note">${p.personalisationNote}</div>`:''}
      <div class="qcard-chips">
        ${p.linkedin_url?`<div class="qchip qc-both" onclick='cp(${JSON.stringify(msg)},"${p.name}","${p.linkedin_url}")'>📋 Copy + Open ↗</div>`:`<div class="qchip qc-copy" onclick='cp(${JSON.stringify(msg)},"${p.name}")'>📋 Copy Msg</div>`}
        ${p.linkedin_url?`<div class="qchip qc-open" onclick="openLI('${p.linkedin_url}')">Open ↗</div>`:''}
        ${hasVars?`<div style="width:100%;font-family:var(--mono);font-size:10px;color:var(--am);padding:2px 0">⚠ Edit [BRACKETS] before sending</div>`:''}
        <div class="qchip qc-sent" onclick="advP(${p.id},'${nextStatus(p.status)||'INTERESTED'}')">${nextLabel(p.status)||'Advance →'}</div>
        ${p.status==='DEMO_DONE'?`<div class="qchip" style="background:var(--pb);color:var(--pu);border-color:#6b21a8;font-family:var(--mono);font-size:10px;padding:5px 11px;border-radius:5px;cursor:pointer" onclick="openNotes(${p.id})">📝 Note</div>`:''}
        <div class="qchip qc-close" onclick="closeP(${p.id})">Close</div>
      </div>
    </div>`;
  });
  el.innerHTML=html;
}

// ══════════════════════════════════
// TRAFFIC
// ══════════════════════════════════
function loadTraffic(){
  fx('/api/v1/ops/traffic').then(data=>{renderTraffic(data);}).catch(()=>{document.getElementById('pane-traffic').innerHTML='<div class="empty"><div class="empty-ico">↗</div><div class="empty-title">Load failed</div></div>';});
}
function renderTraffic(data){
  const el=document.getElementById('pane-traffic');
  const d=data.data||{};const tu=d.totalUnique||0,tr=d.totalRevisits||0,rr=d.revisitRate||0,sm=d.sources||{};const tot=Math.max(tu,1);
  let html=`<div class="sh">Traffic Intelligence <span class="sc">7d</span></div>
  <div class="tcard">
    <div class="tcard-title">Last 7 Days</div>
    <div class="tgrid">
      <div class="tst"><div class="tst-v">${tu}</div><div class="tst-l">Unique</div></div>
      <div class="tst"><div class="tst-v">${tr}</div><div class="tst-l">Revisits</div></div>
      <div class="tst"><div class="tst-v">${rr}×</div><div class="tst-l">Rate</div></div>
      <div class="tst"><div class="tst-v">${tu>0?Math.round(tr/tu*100):0}%</div><div class="tst-l">Return</div></div>
    </div>
    <div class="sbars">
      ${sbar('LinkedIn',sm.LINKEDIN||0,tot,'fl')}${sbar('WhatsApp',sm.WHATSAPP||0,tot,'fw')}${sbar('Direct',sm.DIRECT||0,tot,'fd')}${sbar('Other',sm.OTHER||0,tot,'fo')}
    </div>
  </div>`;
  if(tu===0)html+=`<div class="empty"><div class="empty-ico">↗</div><div class="empty-title">No visits yet</div><div class="empty-sub">Traffic appears once outreach<br>drives visitors to advisiq.in</div></div>`;
  el.innerHTML=html;
  setTimeout(()=>{el.querySelectorAll('.sbar-f').forEach(b=>{if(b.dataset.w)b.style.width=b.dataset.w+'%';});},50);
}
function sbar(l,v,t,c){const p=t>0?Math.min(100,Math.round(v/t*100)):0;return `<div class="sbar"><div class="sbar-l">${l}</div><div class="sbar-t"><div class="sbar-f ${c}" style="width:0%" data-w="${p}"></div></div><div class="sbar-v">${v}</div></div>`;}

// ADD PROSPECT
// ══════════════════════════════════
function renderAdd(){
  const el=document.getElementById('pane-add');
  el.innerHTML=`<div class="sh">Add Prospect</div>
  <div class="aform">
    <div class="aform-title">New Prospect</div>
    <div class="ff"><label class="fl-label">Full Name *</label><input class="fi" id="fn" type="text" placeholder="Rajesh Kumar" autocomplete="off"></div>
    <div class="ff"><label class="fl-label">Role</label><div class="fsel-wrap"><select class="fsel" id="fr"><option>IFA</option><option>RIA</option><option>Wealth Manager</option><option>PMS</option><option>Family Office</option><option>Other</option></select></div></div>
    <div class="ff"><label class="fl-label">Organisation</label><input class="fi" id="fo2" type="text" placeholder="Optional" autocomplete="off"></div>
    <div class="ff"><label class="fl-label">LinkedIn URL *</label><input class="fi" id="fu" type="url" placeholder="https://linkedin.com/in/..." autocomplete="off"></div>
    <div class="ff"><label class="fl-label">Priority Score</label><div class="fsel-wrap"><select class="fsel" id="fs"><option value="3">3 — Priority (posts about market, active)</option><option value="2" selected>2 — Standard</option><option value="1">1 — Low</option></select></div></div>
    <div class="ff"><label class="fl-label">What did they post about?</label><input class="fi" id="fp" type="text" placeholder="Personalisation note" autocomplete="off"></div>
    <button class="fbtn" onclick="addP()">Add to Pipeline → Queue</button>
  </div>`;
}
function addP(){
  const name=document.getElementById('fn').value.trim();const url=document.getElementById('fu').value.trim();
  if(!name||!url){toast('Name and LinkedIn URL required');return;}
  const body={name,linkedin_url:url,role:document.getElementById('fr').value,organisation:document.getElementById('fo2').value.trim()||null,score:parseInt(document.getElementById('fs').value),personalisation_note:document.getElementById('fp').value.trim()||null,source_string:'S1'};
  fx('/api/v1/ops/prospects',{method:'POST',body:JSON.stringify(body)}).then(d=>{
    if(d.status==='OK'){toast('Added: '+name+' → Queue');document.getElementById('fn').value='';document.getElementById('fu').value='';document.getElementById('fo2').value='';document.getElementById('fp').value='';go('queue');}
    else if(d.status==='DUPLICATE')toast('Already in pipeline');
    else toast('Error: '+(d.error||'unknown'));
  }).catch(()=>toast('Network error'));
}

document.getElementById('auth-pw').focus();
